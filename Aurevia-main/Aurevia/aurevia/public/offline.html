<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#07110D">
	<title>Aurevia Exchange · Offline</title>
	<style>
		:root{color-scheme:dark;background:#07110d;color:#f2eee2;font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
		*{box-sizing:border-box}
		body{min-height:100vh;min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
		main{width:min(100%,520px);padding:32px;border:1px solid rgba(212,175,55,.32);border-radius:24px;background:linear-gradient(145deg,#10251b,#09120e);text-align:center;box-shadow:0 24px 70px #0008}
		img{width:72px;height:72px;object-fit:contain}
		h1{margin:18px 0 8px;color:#e3c16d;font-size:clamp(24px,6vw,34px);line-height:1.2}
		p{margin:10px 0;color:#c1cbc4}
		.notice{margin-top:22px;padding:12px;border-radius:12px;background:#ffffff0b;color:#e8d9ae;font-size:14px}
		a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;margin-top:22px;padding:0 20px;border:1px solid #d4af37;border-radius:999px;background:#d4af37;color:#07110d;font-weight:700;text-decoration:none}
		a:focus-visible{outline:3px solid #fff;outline-offset:3px}
	</style>
</head>
<body>
	<main>
		<img src="/icons/icon-192.png" alt="">
		<h1>You’re offline</h1>
		<p>Aurevia could not reach the network. Reconnect and try again to view current information.</p>
		<p class="notice">Live prices, balances, transactions, and account details are not available offline.</p>
		<a href="/">Try again</a>
	</main>
</body>
</html>
